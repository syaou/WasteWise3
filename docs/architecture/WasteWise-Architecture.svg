<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#27745c"/></marker></defs>
<rect width="1600" height="1120" fill="#fafcfb"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183a30">
<text x="40" y="48" font-size="30" font-weight="700">WasteWise — application architecture</text>
<text x="1560" y="48" text-anchor="end" font-size="16">Current implementation · standalone diagram</text>
<path d="M40 215 H1560" stroke="#8b9c95" stroke-width="2" stroke-dasharray="8 6"/>
<text x="45" y="205" font-size="14">HUMAN–SYSTEM BOUNDARY</text>
<text x="65" y="240" font-size="15" font-weight="700">APPLICATION LAYERS · request down / result back up</text>
<text x="850" y="240" font-size="15" font-weight="700">PLATFORM INTEGRATION · separate extension processes</text>
<polyline points="410,180 410,255" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="390,351 390,383" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="390,469 390,501" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="390,604 390,636" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="390,722 390,762" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="65,820 45,820 45,302 65,302" fill="none" stroke="#668376" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="755,426 800,426 800,303 850,303" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1190,351 1190,397" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1202" y="379.0" font-size="13">write / clear</text>
<polyline points="1190,482 1190,526" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1202" y="509.0" font-size="13">read snapshot</text>
<polyline points="1535,302 1555,302 1555,700 1535,700" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1190,745 1190,792" fill="none" stroke="#27745c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1202" y="773.5" font-size="13">category + payload</text>
<rect x="40" y="85" width="1520" height="95" rx="10" fill="#e3f1e9" stroke="#bfd0c7"/>
<text x="57" y="110" font-size="17" font-weight="700">RESIDENT · HUMAN SIDE</text>
<text x="57" y="133" font-size="15">Enter an item and tap “Check disposal guidance” • Save a household address • Choose reminder time</text>
<text x="57" y="152" font-size="15">Read disposal advice in the app • Glance at the Home Screen widget • Expand a collection notification</text>
<rect x="65" y="255" width="690" height="96" rx="10" fill="#ffffff" stroke="#bfd0c7"/>
<text x="82" y="280" font-size="17" font-weight="700">1  VIEWS · SwiftUI</text>
<text x="82" y="303" font-size="15">ScanItemView (Check Item) • HomeView • CollectionCalendarView</text>
<text x="82" y="322" font-size="15">CleanupBookingView • AddressEditorView • CollectionReminderSettingsView</text>
<rect x="65" y="383" width="690" height="86" rx="10" fill="#ffffff" stroke="#bfd0c7"/>
<text x="82" y="408" font-size="17" font-weight="700">2  VIEWMODELS</text>
<text x="82" y="431" font-size="15">ScanItemViewModel • CollectionScheduleViewModel • CleanupBookingViewModel</text>
<text x="82" y="450" font-size="15">Publish results and recovery messages; invoke use cases</text>
<rect x="65" y="501" width="690" height="103" rx="10" fill="#ffffff" stroke="#bfd0c7"/>
<text x="82" y="526" font-size="17" font-weight="700">3  USE CASES · domain rules + typed errors</text>
<text x="82" y="549" font-size="15">ClassifyWasteItemUseCase → validate name; reject unsafe bin guidance</text>
<text x="82" y="568" font-size="15">FindCollectionScheduleUseCase → validate address; derive 2026 dates</text>
<text x="82" y="587" font-size="15">SubmitCleanupBookingUseCase → reject missing / prohibited items</text>
<rect x="65" y="636" width="690" height="86" rx="10" fill="#ffffff" stroke="#bfd0c7"/>
<text x="82" y="661" font-size="17" font-weight="700">4  REPOSITORY BOUNDARY</text>
<text x="82" y="684" font-size="15">WasteWiseRepository protocol → LocalWasteWiseRepository</text>
<text x="82" y="703" font-size="15">Maps stored records into WasteItem domain values</text>
<rect x="65" y="762" width="690" height="117" rx="10" fill="#e3f1e9" stroke="#bfd0c7"/>
<text x="82" y="787" font-size="17" font-weight="700">5  CORE DATA · app-private persistent store</text>
<text x="82" y="810" font-size="15">DisposalCatalogueStore → NSPersistentContainer → local SQLite store</text>
<text x="82" y="829" font-size="15">DisposalCategory 1 ←→ many WasteItemRecord</text>
<text x="82" y="848" font-size="15">First access: seed + save if empty. Lookup: name ==[c] entered name.</text>
<rect x="65" y="920" width="690" height="139" rx="10" fill="#f0f5f2" stroke="#bfd0c7"/>
<text x="82" y="945" font-size="17" font-weight="700">PRIMARY FLOW · check an item</text>
<text x="82" y="968" font-size="15">Request ↓  Resident → View → ViewModel → Use Case → Repository</text>
<text x="82" y="987" font-size="15">First access → initialise catalogue → save seed records to Core Data</text>
<text x="82" y="1006" font-size="15">Read → fetch matching item + category → map to domain guidance</text>
<text x="82" y="1025" font-size="15">Response ↑  Repository → Use Case → ViewModel → View → resident</text>
<text x="82" y="1044" font-size="15">Later lookups read existing records; they do not save user searches.</text>
<rect x="850" y="255" width="685" height="96" rx="10" fill="#ffffff" stroke="#bfd0c7"/>
<text x="867" y="280" font-size="17" font-weight="700">MAIN APP · collection and reminder coordination</text>
<text x="867" y="303" font-size="15">ContentView observes CollectionScheduleViewModel.result</text>
<text x="867" y="322" font-size="15">Saves / clears widget snapshot; calls WidgetCenter.reloadTimelines</text>
<text x="867" y="341" font-size="15">Passes address + collection metadata to CollectionReminderController</text>
<rect x="850" y="397" width="685" height="85" rx="10" fill="#e7effb" stroke="#bfd0c7"/>
<text x="867" y="422" font-size="17" font-weight="700">APP GROUP · shared UserDefaults container</text>
<text x="867" y="445" font-size="15">group.com.WasteWise.sana.Wastewise</text>
<text x="867" y="464" font-size="15">CollectionWidgetStore stores Codable collection dates; no address</text>
<rect x="850" y="526" width="685" height="86" rx="10" fill="#e7effb" stroke="#bfd0c7"/>
<text x="867" y="551" font-size="17" font-weight="700">EXTENSION 1 · WidgetKit / ReminderExtension</text>
<text x="867" y="574" font-size="15">Reads shared dates → builds timeline → renders collection countdown</text>
<text x="867" y="593" font-size="15">Small + medium families; resident views on the Home Screen</text>
<rect x="850" y="659" width="685" height="86" rx="10" fill="#ffffff" stroke="#bfd0c7"/>
<text x="867" y="684" font-size="17" font-weight="700">MAIN APP → iOS NOTIFICATION SERVICE</text>
<text x="867" y="707" font-size="15">CollectionReminderController → UNUserNotificationCenter</text>
<text x="867" y="726" font-size="15">Opt-in weekly trigger + payload: weekday, recycling area, version</text>
<rect x="850" y="792" width="685" height="86" rx="10" fill="#e7effb" stroke="#bfd0c7"/>
<text x="867" y="817" font-size="17" font-weight="700">EXTENSION 2 · CollectionNotificationContent</text>
<text x="867" y="840" font-size="15">iOS routes WASTEWISE_USUAL_COLLECTION notifications on expansion</text>
<text x="867" y="859" font-size="15">NotificationViewController reads payload → custom weekday / area view</text>
<rect x="850" y="920" width="685" height="139" rx="10" fill="#fff3dc" stroke="#bfd0c7"/>
<text x="867" y="945" font-size="17" font-weight="700">OTHER DATA PATHS &amp; IMPLEMENTATION LIMITS</text>
<text x="867" y="968" font-size="15">Repository → ArcGISBinService → council network service for zones</text>
<text x="867" y="987" font-size="15">ResidentAddressStore + reminder controller → app-local UserDefaults</text>
<text x="867" y="1006" font-size="15">Notification extension: payload only; no App Group / database access</text>
<text x="867" y="1025" font-size="15">Cleanup operation: demo receipt only; no saved or submitted booking</text>
<text x="867" y="1044" font-size="15">Domain models: WasteItem • CollectionSchedule • CleanupBookingRequest</text>
<text x="40" y="1096" font-size="14" fill="#526b60">Solid arrows = data/control flow. Core Data writes occur during catalogue seeding; no user-created database write is currently implemented.</text>
</g></svg>